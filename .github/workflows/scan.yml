
name: Daily SEPA scan

on:
  schedule:
    # Times are UTC. 07:20 UTC = 5:20pm Brisbane, after the ASX close (Mon-Fri).
    - cron: "20 7 * * 1-5"
    # 21:30 UTC = 7:30am Brisbane (Tue-Sat), after the US close.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the scan
        run: python -m scanner.run --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
