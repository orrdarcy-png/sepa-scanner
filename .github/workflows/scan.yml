name: Daily SEPA scan

on:
  schedule:
    # Times are UTC. 07:20 UTC = 5:20pm Brisbane, after the ASX close (Mon-Fri).
    - cron: "20 7 * * 1-5"
    # 21:30 UTC = 7:30am Brisbane (Tue-Sat), after the US close.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to scan"
        type: choice
        options: [both, ASX, US]
        default: both

permissions:
  contents: write   # lets the scan save the morning-review shortlist to the "data" branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Get the last published results
        run: |
          mkdir -p site
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" -o site/data.json || echo "no previous results yet"
      - name: Run the scan
        # 5:20pm run = ASX only, 7:30am run = US only, Run workflow button = your choice
        run: |
          M="${{ github.event.inputs.market }}"
          case "${{ github.event.schedule }}" in
            "20 7 * * 1-5")  M=ASX ;;
            "30 21 * * 1-5") M=US ;;
          esac
          if [ "$M" = "ASX" ] || [ "$M" = "US" ]; then
            python -m scanner.run --out site --market "$M"
          else
            python -m scanner.run --out site
          fi
      - name: Save the shortlist for the morning review
        # Stored on a separate "data" branch so main stays clean. The morning review reads it
        # from there and writes reviews.json back to the same branch. Also publishes the
        # TradingView import file with the page, at <page address>/sepa-watchlist.txt.
        run: |
          python -m scanner.shortlist site/data.json /tmp/shortlist.json site/sepa-watchlist.txt
          git config user.name "sepa-scanner"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data 2>/dev/null; then
            git worktree add /tmp/data FETCH_HEAD
            cd /tmp/data && git switch -q -C data
          else
            git worktree add --orphan -b data /tmp/data
            cd /tmp/data
            echo '{"updated": null, "reviews": {}}' > reviews.json
          fi
          cp /tmp/shortlist.json shortlist.json
          git add shortlist.json reviews.json
          git commit -q -m "Shortlist for $(date -u +%F)" || echo "shortlist unchanged"
          git push -q origin data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
